name: Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm ci 2>&1 || npm install 2>&1

      - name: Build frps web
        working-directory: web/frps
        run: npx vite build 2>&1

      - name: Build frpc web
        working-directory: web/frpc
        run: npx vite build 2>&1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build Go binaries
        run: |
          $env:CGO_ENABLED=0
          go build -trimpath -ldflags="-s -w" -o bin/frps.exe ./cmd/frps
          go build -trimpath -ldflags="-s -w" -o bin/frpc.exe ./cmd/frpc

      - name: Download UPX 4.2.4
        run: |
          curl -fsSL -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          unzip -j upx.zip upx-4.2.4-win64/upx.exe -d .
          .\upx.exe --version

      - name: Compress with UPX 4.2.4
        run: .\upx.exe --best --lzma bin/frps.exe bin/frpc.exe 2>&1

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frp-windows
          path: bin/

  build-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux,  arch: amd64,                     suffix: linux_amd64 }
          - { os: linux,  arch: arm64,                     suffix: linux_arm64 }
          - { os: linux,  arch: arm,    goarm: 7,          suffix: linux_arm_hf }
          - { os: linux,  arch: mipsle, gomips: softfloat, suffix: linux_mipsle }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm ci 2>&1 || npm install 2>&1

      - name: Build frps web
        working-directory: web/frps
        run: npx vite build 2>&1

      - name: Build frpc web
        working-directory: web/frpc
        run: npx vite build 2>&1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build Go binaries
        run: |
          export CGO_ENABLED=0
          export GOOS=${{ matrix.target.os }}
          export GOARCH=${{ matrix.target.arch }}
          if [ -n "${{ matrix.target.goarm }}" ]; then export GOARM=${{ matrix.target.goarm }}; fi
          if [ -n "${{ matrix.target.gomips }}" ]; then export GOMIPS=${{ matrix.target.gomips }}; fi
          suffix="${{ matrix.target.suffix }}"
          go build -trimpath -ldflags="-s -w" -tags frps -o "bin/frps_${suffix}" ./cmd/frps
          go build -trimpath -ldflags="-s -w" -tags frpc -o "bin/frpc_${suffix}" ./cmd/frpc

      - name: Download UPX 4.2.4
        run: |
          curl -fsSL -o upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf upx.tar.xz
          sudo cp upx-4.2.4-amd64_linux/upx /usr/local/bin/
          upx --version

      - name: Compress with UPX 4.2.4
        run: upx --best --lzma bin/* 2>&1

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frp-${{ matrix.target.suffix }}
          path: bin/
