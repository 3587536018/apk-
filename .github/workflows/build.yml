name: Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm ci 2>&1 || npm install 2>&1

      - name: Build frps web
        working-directory: web/frps
        run: npx vite build 2>&1

      - name: Build frpc web
        working-directory: web/frpc
        run: npx vite build 2>&1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build Go binaries
        run: |
          $env:CGO_ENABLED=0
          go build -trimpath -o bin/frps.exe ./cmd/frps
          go build -trimpath -o bin/frpc.exe ./cmd/frpc

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frp-windows
          path: bin/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm ci 2>&1 || npm install 2>&1

      - name: Build frps web
        working-directory: web/frps
        run: npx vite build 2>&1

      - name: Build frpc web
        working-directory: web/frpc
        run: npx vite build 2>&1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build Go binaries
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frp-linux
          path: bin/
